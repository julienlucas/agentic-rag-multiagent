[project]
name = "agentic-rag-docchat"
version = "0.1.0"
description = "Multi-agent AGENTIC RAG technique document chat system"
authors = [
    {name = "Julien Lucas", email = "contact@julienlucas.com"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "django>=5.2.6",
    "django-cors-headers>=4.3.0",
    "langchain-core>=0.3.75",
    "langchain-classic>=0.1.0",
    "langchain-mistralai>=0.2.11",
    "langchain-text-splitters>=0.3.9",
    "langgraph>=0.6.6",
    "langsmith>=0.14", # disable_evaluator_tracing (évaluateurs tracés dans agentic-search)
    "loguru>=0.7.3",
    "mistralai>=1.9.9",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.1.1",
    "pypdf[crypto] (>=6.6.0,<7.0.0)", # [crypto] : certains PDF FinanceBench sont chiffrés en AES
    "langchain-aws>=1.8.0",
    "boto3>=1.43.107",
    "qdrant-client>=1.19.1",
    "fastembed>=0.8.1",
    "cohere>=5.20.2",
    "langchain-anthropic>=1.0",
    "django-allauth[socialaccount]>=65.4",
    "dj-database-url>=3.1.2",
    "psycopg[binary]>=3.2",
    "stripe>=16.0.0",
    "openpyxl>=3.1.5",
    "markdownify>=1.2.3",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
